<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>IDN TikTok Spider</title>
  <style>
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      color: #333;
      font-size: 13px;
    }
    h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
      resize: vertical;
      min-height: 80px;
      font-family: monospace;
      line-height: 1.4;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 8px 12px;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:disabled {
      background: #a5c7fc;
      cursor: not-allowed;
    }
    .secondary-btn {
      background: #6c757d;
      margin-top: 6px;
    }
    hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 14px 0;
    }
    .links {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    a {
      color: #0d6efd;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      text-decoration: underline;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 4px;
      display: none;
      word-break: break-word;
      line-height: 1.4;
    }
    .status-success {
      background: #d1e7dd;
      color: #0f5132;
      display: block !important;
    }
    .status-error {
      background: #f8d7da;
      color: #842029;
      display: block !important;
    }
    .status-info {
      background: #cff4fc;
      color: #055160;
      display: block !important;
    }
    .hint {
      font-size: 11px;
      color: #777;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <h3>🕷️ IDN TikTok Spider</h3>

  <div>
    <div class="hint">
      <span><strong>采集链接（支持多行批量输入）</strong></span>
      <span id="link-count" style="color: #0d6efd;"></span>
    </div>
    <textarea
      id="shop-urls"
      rows="4"
      placeholder="每行粘贴一条链接（支持店铺主页、商品页、vt.tokopedia 短链）：&#10;https://vt.tokopedia.com/t/ZS9kXr...&#10;https://www.tokopedia.com/unilever-official"
    ></textarea>
    <button id="add-btn">开始批量采集 / 添加监控</button>
    <button id="scan-now-btn" class="secondary-btn">对全部已监控店铺执行全量扫描</button>
  </div>

  <div id="status"></div>

  <hr />

  <div class="links">
    <a id="dashboard-link" href="#" target="_blank">打开 Dashboard →</a>
    <a id="settings-toggle" href="#" style="font-size: 11px; color: #888;">设置 API</a>
  </div>

  <div id="settings-panel" style="display: none; margin-top: 10px;">
    <input id="worker-url-input" type="text" placeholder="Worker URL" />
    <button id="save-url-btn" style="background:#198754; padding:4px 8px; font-size:11px;">保存 API 节点</button>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
